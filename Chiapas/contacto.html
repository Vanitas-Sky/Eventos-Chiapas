<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - Eventos Chiapas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Contacto</h1>
    <nav>
      <a href="index.html">Inicio</a> |
      <a href="eventos.html">Eventos</a> |
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <p>Esta es una version preliminar de la seccion de contacto.</p>

    <h2>Escribenos</h2>
    <form>
      <p>
        <label for="nombre">Nombre:</label><br />
        <input type="text" id="nombre" name="nombre" />
      </p>

      <p>
        <label for="email">Correo:</label><br />
        <input type="email" id="email" name="email" />
      </p>

      <p>
        <label for="mensaje">Mensaje:</label><br />
        <textarea id="mensaje" name="mensaje" rows="4"></textarea>
      </p>

      <button type="submit">Enviar</button>
    </form>

    <h2>Datos basicos</h2>
    <p>Telefono: +52 961 123 4567</p>
    <p>Correo: info@eventoschiapas.mx</p>
    <p>Tuxtla Gutierrez, Chiapas</p>
  </main>

  <footer>
    <p>Eventos Chiapas - 2026</p>
  </footer>
</body>
</html>
